---
- name: Ensure web root directory exists
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy static index.html template
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_root }}/index.html"
    owner: www-data
    group: www-data
    mode: '0644'

- name: Deploy Nginx virtual host configuration
  ansible.builtin.template:
    src: todo-app.conf.j2
    dest: /etc/nginx/sites-available/todo-app
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Enable Nginx virtual host site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/todo-app
    dest: /etc/nginx/sites-enabled/todo-app
    state: link
  notify: reload nginx

- name: Disable Nginx default virtual host site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Ensure Nginx is running and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
