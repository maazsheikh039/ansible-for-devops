---
- name: Complete AWS Cloud Infrastructure Orchestration
  hosts: localhost
  gather_facts: no
  vars:
    region: "us-east-1"
    instance_type: "t2.micro"
    ami_id: "ami-0c02fb55956c7d316"
    key_name: "ansible-lab-keypair"
    security_group_name: "ansible-lab-sg"
    instance_name: "ansible-provisioned-instance"

  tasks:
    - name: Resolve Default VPC ID
      amazon.aws.ec2_vpc_info:
        region: "{{ region }}"
        filters:
          "is-default": "true"
      register: vpc_info

    - name: Ensure Security Group is present
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        description: "Ansible managed security group"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            ports: [22, 80, 443]
            cidr_ip: 0.0.0.0/0
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
        state: present

    - name: Ensure Key Pair is present
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        key_material: "{{ lookup('file', '~/.ssh/aws-lab-key.pub') }}"
        region: "{{ region }}"
        state: present

    - name: Provision EC2 Compute Instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        security_groups:
          - "{{ security_group_name }}"
        region: "{{ region }}"
        state: present
        wait: yes
        wait_timeout: 300
        tags:
          Environment: "Lab"
          Project: "Ansible-AWS-Lab"
          Owner: "Student"
      register: ec2_result

    - name: Output instance details to runtime tracking file
      copy:
        content: |
          Instance ID: {{ ec2_result.instances[0].instance_id }}
          Public IP: {{ ec2_result.instances[0].public_ip_address }}
          Private IP: {{ ec2_result.instances[0].private_ip_address }}
          State: {{ ec2_result.instances[0].state.name }}
        dest: ../instance-info.txt

    - name: Export dynamic inventory configuration
      copy:
        content: |
          [aws_instances]
          {{ ec2_result.instances[0].public_ip_address }} ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/aws-lab-key
        dest: ../aws-inventory.ini

    - name: Display Infrastructure Provisioning Summary
      debug:
        msg:
          - "=== Infrastructure Provisioning Complete ==="
          - "Instance ID: {{ ec2_result.instances[0].instance_id }}"
          - "Public IP: {{ ec2_result.instances[0].public_ip_address }}"
          - "SSH Connect: ssh -i ~/.ssh/aws-lab-key ec2-user@{{ ec2_result.instances[0].public_ip_address }}"
