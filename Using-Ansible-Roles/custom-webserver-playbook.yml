---
- name: Deploy Customized Web Server
  hosts: webservers
  become: yes
  gather_facts: yes
  
  vars:
    site_title: "DevOps Learning Platform"
    site_message: "Custom configuration deployed successfully via Role Vars!"
    webserver_server_name: "learning.local"
    webserver_admin_email: "admin@devops.local"
  
  roles:
    - webserver
    
  post_tasks:
    - name: Display deployment summary
      debug:
        msg: 
          - "Web server deployed successfully!"
          - "Site title: {{ site_title }}"
          - "Server name: {{ webserver_server_name }}"
