---
- name: Verify Provisioned AWS Infrastructure State
  hosts: localhost
  gather_facts: no
  vars:
    region: "us-east-1"
    security_group_name: "ansible-lab-sg"
    instance_name: "ansible-provisioned-instance"

  tasks:
    - name: Query EC2 Instance State
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": "{{ instance_name }}"
          "instance-state-name": "running"
      register: instance_info

    - name: Validate that active instances were returned
      assert:
        that:
          - instance_info.instances | length > 0
        fail_msg: "CRITICAL: No running EC2 instance with tag Name={{ instance_name }} found!"

    - name: Wait for remote SSH service (Port 22) availability
      wait_for:
        host: "{{ instance_info.instances[0].public_ip_address }}"
        port: 22
        timeout: 90

    - name: Display successful verification notice
      debug:
        msg: "SUCCESS: EC2 Instance {{ instance_info.instances[0].instance_id }} is reachable on Port 22 at {{ instance_info.instances[0].public_ip_address }}."
