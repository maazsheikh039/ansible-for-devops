---
- name: Teardown and Cleanup AWS Infrastructure
  hosts: localhost
  gather_facts: no
  vars:
    region: "us-east-1"
    security_group_name: "ansible-lab-sg"
    instance_name: "ansible-provisioned-instance"
    key_name: "ansible-lab-keypair"

  tasks:
    - name: Query instances tagged for cleanup
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": "{{ instance_name }}"
      register: instance_info

    - name: Terminate EC2 instances
      amazon.aws.ec2_instance:
        instance_ids: "{{ item.instance_id }}"
        region: "{{ region }}"
        state: absent
        wait: yes
        wait_timeout: 300
      loop: "{{ instance_info.instances }}"
      when: instance_info.instances | length > 0

    - name: Delete Security Group
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        region: "{{ region }}"
        state: absent
      ignore_errors: yes

    - name: Delete EC2 Key Pair
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ region }}"
        state: absent

    - name: Confirm Teardown
      debug:
        msg: "AWS Cloud Cleanup completed successfully."
