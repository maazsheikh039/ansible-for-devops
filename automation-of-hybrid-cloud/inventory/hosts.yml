all:
  children:
    onpremises:
      hosts:
        onprem-server:
          ansible_connection: local
          ansible_host: localhost
          environment_type: onpremises
          datacenter: local-dc
          docker_network: onprem-network
    cloud:
      hosts:
        cloud-server:
          ansible_connection: local
          ansible_host: localhost
          environment_type: cloud
          datacenter: aws-us-east-1
          docker_network: cloud-network
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
